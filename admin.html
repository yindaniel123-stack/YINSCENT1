<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin — YINSCENT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=77" />
  </head>
  <body class="page-checkout">
    <header class="header header--checkout">
      <a href="index.html" class="header__logo" aria-label="YINSCENT home">
        <img src="assets/logo.png" alt="YINSCENT" width="200" height="154" />
      </a>
      <a href="index.html" class="checkout-back">返回首页</a>
    </header>

    <main class="admin" id="adminMain">
      <section class="admin-login" id="adminLogin" hidden aria-labelledby="adminLoginTitle">
        <p class="checkout__eyebrow">Restricted area</p>
        <h1 id="adminLoginTitle">Admin sign in</h1>
        <p class="admin-login__lede">超级管理员只填密码。其他管理员填写账号和密码。</p>
        <form class="admin-login__form" id="adminLoginForm" novalidate>
          <label>
            管理员账号
            <input
              type="text"
              name="username"
              id="adminUsername"
              autocomplete="username"
              placeholder="超级管理员留空"
              maxlength="32"
            />
          </label>
          <label>
            Password
            <input
              type="password"
              name="password"
              id="adminPassword"
              autocomplete="current-password"
              required
            />
          </label>
          <p class="admin-login__error" id="adminLoginError" hidden role="alert"></p>
          <button type="submit" class="btn btn--gold" id="adminLoginSubmit">Sign in</button>
        </form>
      </section>

      <section class="desk" id="adminDashboard" hidden>
        <aside class="desk__side" id="deskSide" aria-label="业务管理"></aside>
        <div class="desk__workspace">
          <header class="desk__top">
            <p class="desk__crumb">管理后台 / <span id="deskCrumb">工作台</span></p>
            <div class="desk-user" id="deskUser">
              <button type="button" class="desk-user__btn" id="deskUserBtn" aria-haspopup="true" aria-expanded="false">
                <span class="desk-user__avatar" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 19.2a6.5 6.5 0 0 1 13 0"/></svg>
                </span>
                <span id="deskUserName">管理员</span>
                <span class="desk-user__caret" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>
                </span>
              </button>
              <div class="desk-user__menu" id="deskUserMenu" hidden>
                <button type="button" id="deskUserSwitch">切换账号</button>
                <button type="button" id="deskUserSignOut">退出登录</button>
              </div>
            </div>
            <button type="button" id="adminSignOut" hidden>退出</button>
          </header>
          <div id="deskMain"></div>
          <section class="admin-panel member-console" id="memberConsole" hidden aria-labelledby="membersTitle">
            <div class="admin-panel__head">
              <div>
                <p class="admin-panel__eyebrow">客户</p>
                <h2 id="membersTitle">客户管理</h2>
              </div>
            </div>
            <p class="account-lead">登录校验使用安全哈希。当前密码显示在用户资料中，重置后旧密码不再保留。</p>
            <div class="member-console__body">
              <nav class="member-console__nav" id="consoleNav" aria-label="客户管理"></nav>
              <div class="member-console__main" id="consolePanel"></div>
            </div>
          </section>
        </div>
      </section>

      <p class="admin-loading" id="adminLoading">Checking session…</p>
    </main>

    <footer class="footer footer--checkout">
      <p class="footer__copy">© <span id="year"></span> YINSCENT. All rights reserved.</p>
    </footer>

    <script src="js/paths.js?v=4"></script>
    <script src="js/auth.js?v=7"></script>
    <script src="js/products.js?v=36"></script>
    <script src="js/admin.js?v=22"></script>
    <script src="js/admin-orders.js"></script>
    <script src="js/admin-console.js?v=13"></script>
    <script src="js/admin-desk.js?v=79"></script>
    <script src="js/to-top.js?v=3"></script>
  </body>
</html>
